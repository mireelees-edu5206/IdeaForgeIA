<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaff" />
    <title>Sin conexión · IdeaForge AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        background: #fbfaff;
        color: #201533;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse at 50% 10%, #ecdfff 0, transparent 45%),
          #fbfaff;
      }
      main {
        width: min(32rem, 100%);
        border: 1px solid #ded0f2;
        border-radius: 1.5rem;
        padding: clamp(1.5rem, 5vw, 2.5rem);
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 24px 70px rgb(66 35 102 / 12%);
      }
      .eyebrow {
        color: #7542a4;
        font: 600 0.75rem ui-monospace, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0;
        font-size: clamp(1.8rem, 8vw, 2.6rem);
        line-height: 1.08;
      }
      p {
        color: #5d5369;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 0.75rem;
        border-radius: 0.8rem;
        padding: 0.75rem 1rem;
        background: #7139a3;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #d946ef;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">IdeaForge AI · Modo sin conexión</p>
      <h1>El observatorio está fuera de línea.</h1>
      <p>
        No hay conexión disponible ahora. Tus datos del proyecto no se guardan en este
        dispositivo sin conexión. Vuelve a conectarte para investigar, consultar fuentes y
        sincronizar cambios.
      </p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
